name: IPFS release

# Publishes every GitHub release to IPFS, verifies the CID through two public gateways,
# records it in the release notes and optionally points a DNSLink record at it.
# See docs/configuration.md ("IPFS releases") for the required repository variables/secrets.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to publish
        required: true

permissions:
  contents: write

concurrency:
  group: ipfs-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  # Public build-time values only. Never put secrets here.
  VITE_IPFS_BUILD: 'true'
  VITE_DEMO_MODE: 'false'
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_FOLDER_CONTRACT_ID: ${{ vars.VITE_FOLDER_CONTRACT_ID }}
  VITE_IPFS_GATEWAY_URL: ${{ vars.VITE_IPFS_GATEWAY_URL }}
  VITE_SOROBAN_RPC_URL: ${{ vars.VITE_SOROBAN_RPC_URL }}
  VITE_STELLAR_NETWORK: ${{ vars.VITE_STELLAR_NETWORK }}

jobs:
  publish:
    name: Build and publish to IPFS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload to IPFS
        id: add
        env:
          IPFS_API_URL: ${{ vars.IPFS_API_URL }}
          IPFS_API_TOKEN: ${{ secrets.IPFS_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${IPFS_API_URL:-}" ]; then
            echo "::error::Repository variable IPFS_API_URL is not set."
            exit 1
          fi
          auth=()
          if [ -n "${IPFS_API_TOKEN:-}" ]; then auth=(-H "Authorization: Bearer ${IPFS_API_TOKEN}"); fi
          response=$(curl --fail --silent --show-error "${auth[@]}" \
            -F "file=@dist" \
            "${IPFS_API_URL%/}/api/v0/add?recursive=true&cid-version=1&pin=true&wrap-with-directory=false")
          cid=$(printf '%s\n' "$response" | tail -n 1 | sed -E 's/.*"Hash":"([^"]+)".*/\1/')
          if [ -z "$cid" ] || [ "$cid" = "$response" ]; then
            echo "::error::Could not read the CID from the IPFS response."
            exit 1
          fi
          echo "cid=$cid" >> "$GITHUB_OUTPUT"
          echo "Published $cid"
      - name: Verify CID on two public gateways
        env:
          CID: ${{ steps.add.outputs.cid }}
        run: |
          set -euo pipefail
          asset=$(grep -oE 'assets/[^"]+\.js' dist/index.html | head -n 1)
          if [ -z "$asset" ]; then
            echo "::error::No hashed JS asset found in dist/index.html."
            exit 1
          fi
          for gateway in https://ipfs.io/ipfs https://dweb.link/ipfs; do
            echo "Checking $gateway/$CID"
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --location --max-time 30 \
                  "$gateway/$CID/" | grep -q 'id="root"'; then
                break
              fi
              if [ "$attempt" = 30 ]; then
                echo "::error::$gateway did not serve index.html for $CID."
                exit 1
              fi
              sleep 10
            done
            curl --fail --silent --show-error --location --max-time 60 \
              --output /dev/null "$gateway/$CID/$asset"
          done
      - name: Record CID in release notes
        env:
          GH_TOKEN: ${{ github.token }}
          CID: ${{ steps.add.outputs.cid }}
        run: |
          set -euo pipefail
          marker='<!-- ipfs-release -->'
          body=$(gh release view "$TAG" --json body --jq .body)
          body=${body//"$marker"*/}
          notes=$(printf '%s\n%s\n\n### IPFS\n\n- CID: `%s`\n- https://ipfs.io/ipfs/%s/\n- https://dweb.link/ipfs/%s/\n' \
            "$body" "$marker" "$CID" "$CID" "$CID")
          gh release edit "$TAG" --notes "$notes"
      - name: Update DNSLink
        if: vars.IPFS_DNSLINK_DOMAIN != ''
        env:
          CID: ${{ steps.add.outputs.cid }}
          DOMAIN: ${{ vars.IPFS_DNSLINK_DOMAIN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail
          api=https://api.cloudflare.com/client/v4
          name="_dnslink.$DOMAIN"
          content="dnslink=/ipfs/$CID"
          record=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records?type=TXT&name=$name")
          id=$(printf '%s' "$record" | sed -nE 's/.*"id":"([^"]+)".*/\1/p' | head -n 1)
          payload=$(printf '{"type":"TXT","name":"%s","content":"%s","ttl":300}' "$name" "$content")
          if [ -n "$id" ]; then
            curl --fail --silent --show-error -X PUT \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records/$id" > /dev/null
          else
            curl --fail --silent --show-error -X POST \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H 'Content-Type: application/json' \
              --data "$payload" "$api/zones/$CLOUDFLARE_ZONE_ID/dns_records" > /dev/null
          fi
          echo "DNSLink $name -> $content"
