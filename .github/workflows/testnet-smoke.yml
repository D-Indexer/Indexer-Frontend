name: Testnet smoke

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: testnet-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run testnet smoke test
        # The funder secret is only exposed as an env var; GitHub masks it in logs and the test never prints it.
        run: npm test -- testnet
        env:
          FOLDER_TESTNET_SMOKE: '1'
          FOLDER_TESTNET_FUNDER_SECRET: ${{ secrets.FOLDER_TESTNET_FUNDER_SECRET }}

      - name: Open or update the tracking issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Testnet smoke failing'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 })
            const existing = issues.find((issue) => issue.title === title && !issue.pull_request)
            const body = `The nightly testnet smoke test failed: ${run}`
            if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number, body })
            } else {
              await github.rest.issues.create({ ...context.repo, title, body })
            }

      - name: Close the tracking issue on recovery
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Testnet smoke failing'
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const { data: issues } = await github.rest.issues.listForRepo({ ...context.repo, state: 'open', per_page: 100 })
            for (const issue of issues.filter((item) => item.title === title && !item.pull_request)) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: issue.number, body: `Recovered: ${run}` })
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, state: 'closed' })
            }
