name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:coverage
      - name: Changed-line coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs')
            const summaryPath = 'coverage/coverage-summary.json'
            if (!fs.existsSync(summaryPath)) {
              core.setFailed('coverage/coverage-summary.json not found; run npm run test:coverage first')
              return
            }
            const summary = JSON.parse(fs.readFileSync(summaryPath, 'utf8'))
            const files = Object.keys(summary).filter((key) => key !== 'total')
            const { data: changed } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            })
            const changedFiles = changed
              .filter((file) => file.status !== 'removed')
              .map((file) => file.filename)
            const rows = []
            for (const file of files) {
              const relative = file.replace(`${process.cwd()}/`, '')
              if (!changedFiles.includes(relative)) continue
              const metrics = summary[file]
              rows.push(
                `| \`${relative}\` | ${metrics.lines.pct}% | ${metrics.branches.pct}% | ${metrics.functions.pct}% | ${metrics.statements.pct}% |`,
              )
            }
            const body = rows.length
              ? [
                  '### Changed-line coverage',
                  '',
                  '| File | Lines | Branches | Functions | Statements |',
                  '| --- | --- | --- | --- | --- |',
                  ...rows,
                ].join('\n')
              : '### Changed-line coverage\n\nNo changed source files are covered by the test suite.'
            await core.summary.addRaw(body).write()
            core.info(body)
      - run: npm run build
        env:
          VITE_API_URL: http://localhost:3000
          VITE_FOLDER_CONTRACT_ID: CDDQK74SMH4RB4HYLHM6BYZPTAMDMRISHW5Q274KADVZVFD57K43O6KV
